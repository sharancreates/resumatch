name: Aion Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read          # Read PR code (never stored or leaked)
  pull-requests: write    # Post inline review comments

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Aion Reviewer
        uses: Wall-E-30/code-reviewer@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          provider: openrouter
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: 'qwen/qwen-2.5-coder-32b-instruct:free'  # 100% Free OpenRouter model
          mode: visible                                   # 'visible' (comments) or 'shadow' (silent)
          max-comments: 5                                 # Strict cap: max 5 comments per PR
          min-confidence: "0.75"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AION_KILL_SWITCH: ${{ secrets.AION_KILL_SWITCH }}
