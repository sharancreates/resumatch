name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    name: Backend Validation & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'server/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Verify Python compilation
        run: |
          python -m compileall server/

      - name: Verify Alembic migration graph
        run: |
          cd server
          python -m alembic heads

      - name: Run backend automated tests
        env:
          SECRET_KEY: test-secret-key-ci-environment-12345
          ENVIRONMENT: test
        run: |
          PYTHONPATH=server python -m pytest server/tests/ -v

  frontend-check:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install client dependencies
        working-directory: ./client
        run: |
          npm install

      - name: Run ESLint
        working-directory: ./client
        run: |
          npm run lint

      - name: Run Vitest unit tests
        working-directory: ./client
        run: |
          npx vitest run

      - name: Build production bundle
        working-directory: ./client
        run: |
          npm run build
