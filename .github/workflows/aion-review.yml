name: Aion Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    # Trigger on PR changes OR when someone types /review in a PR comment
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # When triggered by comment, checkout the actual PR branch rather than main
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      - name: Run Aion Reviewer
        uses: Wall-E-30/code-reviewer@main
        with:
          provider: 'openrouter'
          model: 'qwen/qwen-2.5-coder-32b-instruct'
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: 'visible'
          fail-on-findings: 'true'
